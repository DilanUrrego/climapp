apiVersion: apps/v1
kind: Deployment
metadata:
  name: climapp-backend
  labels:
    app: climapp
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: climapp
      component: backend
  template:
    metadata:
      labels:
        app: climapp
        component: backend
    spec:
      containers:
      - name: backend
        image: emanuelongo2310/backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: climapp-secret
              key: DATABASE_URL
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: climapp-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: climapp-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: climapp-config
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: climapp-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: climapp-config
              key: POSTGRES_PORT
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: climapp-secret
              key: API_KEY
        - name: WEATHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: climapp-secret
              key: WEATHER_API_KEY
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: climapp-backend-service
  labels:
    app: climapp
    component: backend
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
    protocol: TCP
    name: http
  selector:
    app: climapp
    component: backend
